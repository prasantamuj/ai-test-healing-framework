name: API Tests (Playwright Java)

on:
  push:
    branches: [main]
    paths:
      - 'api-tests-java/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api-tests-java/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-tests-java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: mvn -B test

      - name: Upload Surefire report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-surefire-report
          path: api-tests-java/target/surefire-reports/
          retention-days: 14
